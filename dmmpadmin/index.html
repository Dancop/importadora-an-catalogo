<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gestión privada | Importadora A&N</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-body">
  <main class="admin-shell">
    <section id="login-view" class="login-card">
      <img src="../assets/logo.png" alt="Importadora A&N">
      <p class="eyebrow">Acceso privado</p>
      <h1>Gestión del catálogo</h1>
      <p>Ingresa con una cuenta autorizada.</p>
      <form id="login-form">
        <label>Correo electrónico<input id="email" type="email" autocomplete="username" required></label>
        <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit">Ingresar</button>
        <p id="login-error" class="form-message" role="alert"></p>
      </form>
    </section>

    <div id="admin-mount" aria-live="polite"></div>
  </main>
  <script type="module" src="../js/admin-auth.js"></script>
</body>
</html>
